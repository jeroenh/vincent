version: '3.7'

services:
  vincent:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile-django
      args:
        ASSET_PATH: "/static/webpack_bundles/"
        API_URL: "http://app.vincent.test:8000/vincent"
    image: vincent
    volumes:
      - static_data:/home/vincent/app/staticfiles
      - attachment_data:/home/vincent/app/attachments
    command: app-startup.sh
    networks:
      vincent_app: {}
      vincent_db: {}
    expose:
      - 8000
    env_file:
      - ../../.env.test.local
    environment:
      WSGI_APP: vincent.wsgi
      WORKDIR: .
      DB_NAME: vincent
      OAUTH_SERVER_BASEURL: "http://auth.vincent.test:8000"
      OAUTH_SERVER_INTERNAL_URL: "http://auth-int.vincent.test:8000"
      #CORS_ALLOWED_ORIGINS: '["http://localhost:8080", "http://localhost:8081"]'
      CORS_ALLOWED_ORIGINS: '["http://app.vincent.test:8000"]'
      ALLOWED_HOSTS: '["localhost", "127.0.0.1", "app.vincent.test", "auth.vincent.test"]'
      JOB_MANAGER: cvdp.appcomms.async.AdviseWorker_Communicator
    depends_on:
      db:
        condition: service_healthy

  vincent_worker:
    image: vincent
    volumes:
      - static_data:/home/vincent/app/staticfiles-worker
    command: app-startup.sh
    networks:
      vincent_auth: {}
      vincent_db: {}
    expose:
      - 8001
    env_file:
      - ../../.env.test.local
    environment:
      WSGI_APP: vincent.wsgi
      IS_WORKER_APP: True
      WORKDIR: .
      DB_NAME: vincent
      JOB_MANAGER: cvdp.appcomms.async.AdviseWorker_Communicator
      ALLOWED_HOSTS: '["localhost", "127.0.0.1", "app.vincent.test", "auth.vincent.test"]'
    depends_on:
      db:
        condition: service_healthy
      # I don't know if we need this, but we want to wait until we have the
      # most recent image of the vincent container build before starting the
      # provider.
      vincent:
        condition: service_started

  oauth2provider:
    image: vincent
    volumes:
      - static_data:/home/vincent/app/staticfiles-provider
    command: app-startup.sh
    networks:
      vincent_auth: {}
      vincent_db: {}
    expose:
      - 8000
    env_file:
      - ../../.env.test.local
    environment:
      WSGI_APP: oauth2provider.wsgi
      WORKDIR: oauth2provider 
      DB_NAME: vincent_oauth2
      ALLOWED_HOSTS: '["localhost", "127.0.0.1", "auth.vincent.test", "auth-int.vincent.test", "app.vincent.test"]'
    depends_on:
      db:
        condition: service_healthy
      # I don't know if we need this, but we want to wait until we have the
      # most recent image of the vincent container build before starting the
      # provider.
      vincent:
        condition: service_started

  nginx:
    build:
      context: ./nginx-local
    volumes:
      - static_data:/home/vincent/app/staticfiles
    networks:
      vincent_app: 
        aliases:
          - app.vincent.test
          - auth-int.vincent.test
      vincent_auth:
        aliases:
          - auth.vincent.test
    ports:
      - "8000:80"
      #- "8081:81"
    expose:
      - 8000
    depends_on: 
      - vincent
      - oauth2provider

  db:
    image: postgres:14-alpine
    env_file:
      - ../../.env.test.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      vincent_db: {}
    #ports:
    #  - "5432:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_data:
  assets_data:
  attachment_data:

networks:
  vincent_app: {}
  vincent_auth: {}
  vincent_db: {}