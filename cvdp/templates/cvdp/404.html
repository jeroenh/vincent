{% extends CVDP_BASE_TEMPLATE %}
{% load static %}
{% block content %}

<div class="container-xxl flex-grow-1 container-p-y">
  <h2>Page Not Found :(</h2>

  <div class="row mt-5">
    <div class="col-lg-12">
      <h3> Oops! 😖 That page couldn't be found. </h3>
      <p class="lead">It seems like the page you were looking for has moved or has been removed.</p>
      {% if suggest %}
      <p class="lead">Did you mean <a href="{{suggest}}">{{suggest}}</a>?</p>
      {% endif %}
      <a href="{% url 'cvdp:dashboard' %}" class="btn btn-primary">Back to home</a>
    </div>
  </div>
</div>

{% endblock %}
